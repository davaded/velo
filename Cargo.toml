[workspace]
resolver = "2"
members = [
    "crates/velo-protocol",
    "crates/velo-worktree",
    "crates/velo-agent",
    "crates/velo-daemon",
    "crates/velo-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Velo Contributors"]
repository = "https://github.com/daiyudai/velo"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"
portable-pty = "0.8"

velo-protocol = { path = "crates/velo-protocol" }
velo-worktree = { path = "crates/velo-worktree" }
velo-agent = { path = "crates/velo-agent" }
velo-daemon = { path = "crates/velo-daemon" }
