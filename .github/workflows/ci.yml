name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-workspace:
    name: Rust Workspace Check & Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Cargo Workspace Tests
        run: cargo test --workspace

  desktop-web:
    name: Velo Desktop UI Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/velo-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: apps/velo-desktop/pnpm-lock.yaml
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck & Vite Production Bundle
        run: pnpm run build

  ios-app:
    name: Velo iOS App & Live Activity Build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/velo-ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen
      - name: Generate Xcode Project & Compile (Unsigned CI Check)
        run: |
          xcodegen generate
          xcodebuild \
            -project VeloMobile.xcodeproj \
            -scheme VeloMobile \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
