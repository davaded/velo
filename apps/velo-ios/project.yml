name: VeloMobile
options:
  bundleIdPrefix: dev.velo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "13"
    DEVELOPMENT_TEAM: "76S2FLMS7Q"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  VeloMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Shared
      - path: Assets.xcassets
    dependencies:
      - target: VeloLiveActivityExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daiyudai.velo.mobile
        INFOPLIST_KEY_CFBundleDisplayName: Velo
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Velo
        NSCameraUsageDescription: "用于扫描 Mac 端 Velo 配对二维码（支持局域网、Tailscale 及端到端加密中继）"
        NSPhotoLibraryAddUsageDescription: "用于将对话中的高清图片或截图保存到系统相册"
        NSMicrophoneUsageDescription: "用于录制语音指令并通过端到端加密通道转写为 Prompt"
        NSSpeechRecognitionUsageDescription: "用于将你的语音实时识别为对话指令"
        NSLocalNetworkUsageDescription: "用于在同 Wi-Fi 或 Tailscale 下直连你的 Mac Velo 守护进程"
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.velo.mobile.pair
            CFBundleURLSchemes:
              - velo

  VeloLiveActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LiveActivityExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daiyudai.velo.mobile.liveactivity
        INFOPLIST_KEY_CFBundleDisplayName: VeloLiveActivity
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: LiveActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: VeloLiveActivity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
